# Local infrastructure for PulseOps.
# Start:  docker compose up -d      Stop: docker compose down
# Wipe all data too:                docker compose down -v
#
# Credentials here are for LOCAL DEVELOPMENT ONLY.

name: pulseops

services:
  # PostgreSQL with the pgvector extension pre-installed
  # (we use pgvector in Step 9 for "find similar past incidents").
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pulseops-postgres
    environment:
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops
      POSTGRES_DB: pulseops
    # Host port 5433 (not 5432) so it can run alongside other local Postgres
    # instances (e.g. work projects). Inside Docker it's still 5432.
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis: cache, distributed locks, short-lived counters (sliding windows).
  redis:
    image: redis:7-alpine
    container_name: pulseops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redpanda: a Kafka-compatible broker in a single container (no ZooKeeper).
  # Two listeners:
  #   internal  redpanda:9092   -> used by other containers (e.g. the console)
  #   external  localhost:19092 -> used by our NestJS app running on your machine
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: pulseops-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=warn
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Web UI to browse Kafka topics and messages: http://localhost:8080
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: pulseops-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  pg-data:
  redpanda-data:
